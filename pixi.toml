[workspace]
authors = ["fossilx"]
channels = ["conda-forge"]
name = "fxt-pixi"
platforms = ["linux-64"]
version = "0.2.0"


[environments]
default = { features = ["apps"], solve-group = "main" }
lib = { features = [], solve-group = "main"} #doesn't have apps deps
#this is so you can run pytest in the "lib" env and it will error out if it
#detects you using one of the cli libs
jupyter = { features = ["apps", "jupyter"], solve-group = "main"}


[activation]
#time zone support
env = { PYTHONTZPATH = "$CONDA_PREFIX/share/zoneinfo" }


[dependencies] #shared by all
python = ">=3.15.2,<3.16"
pytest = ">=9.2.0,<10"
ruff = ">=0.17.6,<0.18"
lightgbm = ">=4.7.0,<5"
polars = ">=2.1.0,<3"
pandas = ">=3.1.1,<4"
pyarrow = ">=26.0.1,<27"
duckdb = ">=2.0.1,<3"
tzdata = ">=2026e,<2027a"
pydantic = ">=2.14.4,<3"
pydantic-settings = ">=2.16.3,<3"
sqlite-utils = ">=4.2.1,<5"
rich = ">=15.0.0,<16"
pathspec = ">=1.1.1,<2"
click = ">=8.5.1,<9"
inquirerpy = ">=0.3.4,<0.4"
rapidfuzz = ">=3.14.6,<4"


[pypi-dependencies]
fxt = { path = ".", editable = true }
dukascopy-python = ">=7.0.0, <8"
getch = ">=1.0, <2"



#======================================================================(70)
# tasks
#----------------------------------------------------------------------(70)
[tasks]
test       = "pytest -m 'not slow'"
test-slow  = "pytest -m slow"
test-fxt   = "pytest tests/fxt -m 'not slow'"
test-apps  = "pytest tests/fxtapps -m 'not slow'"
test-projects = "pytest projects"
tests = [{ task = "test" }]

# TODO add command to test specific project?
migrate-downloads = "python scripts/migrate_downloads.py"   # one-off, see fxt.data.ingest.migrate

[tasks.zip]
cmd = "python scripts/zip/zip-dir.py . --out dist/fxt-repo.zip"

[tasks.zip-pkg]
args = ["pkg"]
#cmd = "python scripts/zip/zip.py packages/{{ pkg }}/src/{{ pkg }}"
cmd = "python scripts/zip/zip-dir.py src/{{ pkg }}"
description = "Zip project pkg"

# [tasks.reader]
# cmd = "python -m fxtapps.reader.cli data"





#======================================================================(70)
# group: apps
#----------------------------------------------------------------------(70)
[feature.apps.dependencies]
#for deps that are only needed by apps (not by main fxt lib)
alive-progress = ">=3.3.0,<4"
loguru = ">=0.8.0,<0.9"
textual = ">=8.2.8,<9"

[feature.apps.tasks]
#! # or define a task and run with: pixi run -e lib test-lib
#test-lib = "pytest tests/fxt"
example = "python -m fxtapps.example"
ingest = "python -m fxtapps.ingest"
derive = "python -m fxtapps.derive"
lake-check = "python -m fxtapps.lakecheck"
reader = "python -m fxtapps.reader.cli data"
research = "python -m fxtapps.research"


#======================================================================(70)
# group: jupyter
#----------------------------------------------------------------------(70)
[feature.jupyter.dependencies]
#traitlets = "*"
jupyterlab = ">=4.6.6,<5"
#pixi-kernel = ">=0.7.1,<0.8"
nbformat = ">=5.11.1,<6"
ipykernel = ">=7.4.0,<8"
ipywidgets = ">=8.1.9,<9"
altair = ">=6.3.0,<7"
plotly = ">=7.1.0,<8"
bokeh = ">=3.10.0,<4"
pygal = ">=3.1.3,<4"
jupyter_bokeh = ">=4.1.0,<5"

[feature.jupyter.pypi-dependencies]
jupyterlab-execute-time = ">=3.3.0, <4"
jupytext = ">=1.17, <2"   # notebooks are versioned as percent-format .py

[feature.jupyter.tasks]
lab = "python jupyter/.jupyter/launcher.py"

